services:

  postgres:
    image: postgres:16-alpine
    container_name: hospitalflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospitalflow
      POSTGRES_PASSWORD: hospitalflow
      POSTGRES_DB: hospitalflow_dev
    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitalflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospitalflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
